<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registration — Faceless YouTube Workshop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><path d='M38 30l30 20-30 20z' fill='%23ffc42e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="wrap nav__inner">
    <a class="brand" href="index.html"><span class="brand__mark" aria-hidden="true">▶</span><span data-cfg="brandName">Workshop</span></a>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot__legal">
      <span>© <span id="year"></span> <span data-cfg="businessName"></span></span>
      <span><a href="terms.html">Terms</a> · <a href="refund.html">Refunds</a> · <a href="contact.html">Contact</a></span>
    </div>
  </div>
</footer>

<script src="js/config.js"></script>
<script>
(function(){
  "use strict";
  var C = window.CONFIG || {};
  var q = new URLSearchParams(location.search);
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};

  Array.prototype.forEach.call(document.querySelectorAll("[data-cfg]"),function(el){
    var v=C[el.getAttribute("data-cfg")];
    if(v) el.textContent=v;
  });
  document.getElementById("year").textContent=new Date().getFullYear();

    /* This legacy page is retained for old links. Direct UPI confirmation
      happens through the WhatsApp/email actions on checkout.html. */
  var paymentId = q.get("payment_id") || "";
  var orderId   = q.get("order_id") || "";

  var reg = {};
  try { reg = JSON.parse(sessionStorage.getItem("reg") || "{}"); } catch(e){}

  var el = document.getElementById("status");

  if (!paymentId) {
    /* Reached directly, or without any payment reference. Say so plainly
       instead of showing a confirmation nobody earned. */
    el.innerHTML =
      '<div class="status__icon status__icon--no" aria-hidden="true">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#54545a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>' +
      '</div>' +
      '<h1>No payment to confirm</h1>' +
      '<p class="status__lead">This page didn\'t receive a payment reference, so there is nothing to confirm here. ' +
      'If you have already paid, send your UTR and payment screenshot to support from the checkout page so we can verify it.</p>' +
      '<div class="status__actions">' +
        '<a class="btn btn--primary" href="checkout.html">Go to registration</a>' +
        '<a class="btn btn--ghost" href="contact.html">Contact support</a>' +
      '</div>';
    return;
  }

  var rows = [
    reg.name ? ["Name", reg.name] : null,
    ["Payment reference", paymentId],
    orderId ? ["Order reference", orderId] : null,
    ["Workshop", C.workshopName],
    ["Date", C.workshopDate + (C.workshopDay ? " (" + C.workshopDay + ")" : "")],
    ["Time", C.workshopTime],
    ["Duration", C.duration],
    ["Where", C.format + (C.platform ? " on " + C.platform : "")],
    reg.email ? ["Joining link goes to", reg.email] : null
  ].filter(Boolean);

  el.innerHTML =
    '<div class="status__icon status__icon--ok" aria-hidden="true">' +
      '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
    '</div>' +
    '<h1>You\'re registered 🎉</h1>' +
    '<p class="status__lead">' +
      (reg.name ? "Thanks, " + esc(reg.name.split(" ")[0]) + ". " : "") +
      'Your payment reference was received. We will verify the UTR and confirm your seat by email or WhatsApp.</p>' +
    '<div class="details">' +
      rows.map(function(r){
        return '<div class="details__row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
      }).join("") +
    '</div>' +
    '<div class="details" style="margin-top:14px">' +
      '<div class="details__row" style="display:block">' +
        '<span style="display:block;margin-bottom:8px">How to join</span>' +
        '<b style="display:block;text-align:left;font-weight:500;line-height:1.6">' +
          'The joining link is sent to your email and WhatsApp before the session starts. ' +
          'Check your spam folder if it hasn\'t arrived on the morning of the workshop, then message support. ' +
          'Join a few minutes early on a stable connection.' +
        '</b>' +
      '</div>' +
    '</div>' +
    '<div class="status__actions">' +
      (C.whatsappNumber ? '<a class="btn btn--primary" href="https://wa.me/' + esc(C.whatsappNumber) + '">Message support on WhatsApp</a>' : '') +
      (C.supportEmail ? '<a class="btn btn--ghost" href="mailto:' + esc(C.supportEmail) + '">Email ' + esc(C.supportEmail) + '</a>' : '') +
    '</div>' +
    '<p class="fineprint" style="margin-top:22px">Keep your UTR and payment screenshot until your seat is confirmed.</p>';
})();
</script>
</body>
</html>
